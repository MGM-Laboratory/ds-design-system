name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: "--max-old-space-size=4096"
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build-docs:
    name: Build Storybook + docs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Build Storybook
        run: pnpm --filter storybook build

      - name: Assemble Pages site
        run: |
          mkdir -p public-site
          if [ -d apps/storybook/storybook-static ]; then
            cp -R apps/storybook/storybook-static/* public-site/
            echo "✓ Storybook copied to public-site/"
          else
            echo "⚠ Storybook build did not produce output — writing placeholder"
            cat > public-site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><title>MGM Design System</title>
          <style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:48px auto;max-width:600px;padding:0 24px;color:#0e1116;background:#fff}h1{font-size:32px;margin:0 0 16px}a{color:#3a6dc5}</style></head>
          <body><h1>MGM Design System</h1><p>Storybook is being built. Check back soon.</p><p><a href="https://www.npmjs.com/org/labmgm">View packages on npm →</a></p></body></html>
          HTML
          fi
          # CNAME tells GitHub Pages to serve the custom domain.
          echo "ds.labmgm.org" > public-site/CNAME
          echo "✓ Wrote CNAME for ds.labmgm.org"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
