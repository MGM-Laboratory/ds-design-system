name: Canary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  canary:
    name: Publish canary preview
    if: contains(github.event.pull_request.labels.*.name, 'release-canary')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Publish canary
        run: pnpm canary
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Comment install instructions
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📦 Canary published! Install with:\n\n\`\`\`bash\npnpm add @labmgm/react@canary\n\`\`\`\n\nCommit: \`${sha}\``,
            });
